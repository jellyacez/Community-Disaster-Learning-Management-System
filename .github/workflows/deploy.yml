name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2HOST }}
          username: ${{ secrets.EC2USER }}
          key: ${{ secrets.EC2SSHKEY }}
          script: |
            # Stop immediately if any command fails
            set -e

            echo "1. Navigating to project directory and pulling latest code..."
            cd /var/www/lms/Community-Disaster-Learning-Management-System
            git pull origin main

            echo "2. Updating and building Frontend (React Vite)..."
            cd /var/www/lms/Community-Disaster-Learning-Management-System/client
            PUPPETEER_SKIP_DOWNLOAD=true npm install
            npm run build

            echo "3. Updating Backend dependencies and restarting PM2..."
            cd /var/www/lms/Community-Disaster-Learning-Management-System/server
            PUPPETEER_SKIP_DOWNLOAD=true npm install

            export $(grep -v '^#' .env | xargs)
            psql "$DATABASE_URL" -f migrations/migrations.sql

            echo "4. restarting PM2..."
            pm2 restart all --update-env



            echo "Deployment completed successfully!"
