<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bacolor LMS" />

    <!--
      CSP (Content Security Policy) — Defence-in-depth fallback.
      The server-side Helmet CSP is the primary enforcement layer.
      NOTE: Vite dev mode (npm run dev) requires 'unsafe-eval' for Hot Module Replacement.
            It is intentionally REMOVED here so the production build is not weakened.
            If you see CSP errors in dev, this is expected and safe to ignore.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://localhost:* https: blob:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' data: http://localhost:* ws://localhost:* https:; media-src 'self' data: blob: http://localhost:* https:; frame-src 'self' data: blob: http://localhost:* https:; object-src 'self' blob:;"
    />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bacolor_theme");
          var isDark =
            saved === "dark" ||
            (saved === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <meta
      name="description"
      content="Community Disaster Learning Management System - Empowering residents with disaster preparedness training and real-time announcements."
    />

    <title>Bacolor LMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
