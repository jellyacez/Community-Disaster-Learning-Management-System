server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-Frame-Options          "DENY"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                 always;

    # ── API reverse proxy ────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the Express container on the
    # internal Docker network. This means the browser only ever talks to
    # port 80 — no need to expose the server port publicly.
    location /api/ {
        proxy_pass         http://lms_server:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket / SSE connections alive
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Better Auth pass-through ─────────────────────────────────────────────
    # Better Auth mounts its own routes under /api/auth by default.
    # The /api/ block above already covers this — no extra location needed.

    # ── SPA routing ──────────────────────────────────────────────────────────
    # Any path that doesn't match a static file falls back to index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite outputs hashed filenames, so assets can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── HTML entry point — never cache ───────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
